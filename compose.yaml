services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Development email catcher: the backend delivers over SMTP to
  # mailpit:1025 and every message shows up in the web UI instead of being
  # sent anywhere. Unused when EMAIL_PROVIDER=resend.
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI
      - "1025:1025"                     # SMTP (for a backend run on the host)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
      # The utf CLI for the push validation gate is built from the universal
      # testing framework checkout; point UTF_SRC elsewhere to use another one.
      additional_contexts:
        utf-src: ${UTF_SRC:-../UniversalTestingFramework}
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
      # The email transport is selected by ENV/EMAIL_PROVIDER in
      # backend/.env; only the in-network Mailpit address is pinned here.
      MAILPIT_SMTP_ADDR: mailpit:1025
      MAILPIT_UI_URL: http://localhost:${MAILPIT_UI_PORT:-8025}
      # The backend image ships the utf CLI, so the gate invokes it directly
      # instead of going through dune the way the .env.example default does.
      VALIDATION_GENERATE_COMMAND: utf gen python
    ports:
      - "8888:8888"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/openapi.json"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./backend:/app
      - gomod:/go/pkg/mod

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules

volumes:
  pgdata:
  gomod:
  node_modules:
